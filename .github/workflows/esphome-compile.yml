name: ESPHome Compile

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.yaml'
      - 'my_components/**'
      - '.github/workflows/esphome-compile.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4  # Upgrade auf v4 für Node.js-Kompatibilität
    
    - name: Set up Python
      uses: actions/setup-python@v5  # Upgrade auf v5
      with:
        python-version: '3.11'
        
    - name: Cache PlatformIO & ESPHome
      uses: actions/cache@v4
      with:
        path: |
          ~/.platformio
          ~/.cache/pip
          .esphome
        key: ${{ runner.os }}-esphome-${{ hashFiles('esp-boot.yaml') }}
        restore-keys: |
          ${{ runner.os }}-esphome-
    
    - name: Install ESPHome
      run: pip install esphome
    
    - name: Compile ESP-Boot
      run: esphome compile esp-boot.yaml
    
    - name: Upload firmware artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: firmware-esp-boot
        # Pfad korrigiert von 'esp32-s3-devkitc-1' zu 'esp-boot'
        # Wir fangen sowohl ota als auch factory ab
        path: |
          .esphome/build/esp-boot/.pioenvs/esp-boot/firmware.factory.bin
          .esphome/build/esp-boot/.pioenvs/esp-boot/firmware.ota.bin
        retention-days: 30
