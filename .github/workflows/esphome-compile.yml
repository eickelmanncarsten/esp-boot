name: ESPHome Compile

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.yaml'
      - 'my_components/**'
      - '.github/workflows/esphome-compile.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install ESPHome
      run: pip install esphome
    
    - name: Compile ESP-Boot
      run: esphome compile esp-boot.yaml
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: path/to/artifact
      with:
        name: firmware-esp-boot
        path: .esphome/build/esp-boot/.pioenvs/esp32-s3-devkitc-1/firmware.bin
        retention-days: 30
