name: ESPHome Compile

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

# HIER LÖSEN WIR ES: Wir zwingen den Runner per Umgebungsvariable auf Node 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      # Umstellung auf v5 (nativ Node 24 kompatibel)
      - name: Checkout repository
        uses: actions/checkout@v5

      # Umstellung auf v6 (nativ Node 24 kompatibel)
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Umstellung auf v5 (nativ Node 24 kompatibel)
      - name: Cache PlatformIO & ESPHome
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio
            ~/.esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('esp-boot.yaml') }}

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Compile ESP-Boot
        run: |
          esphome compile esp-boot.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: firmware-esp-boot
          path: .esphome/build/esp-boot/.pioenvs/esp-boot/firmware.factory.bin
