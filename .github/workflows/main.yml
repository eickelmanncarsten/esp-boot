name: Compile ESP-Boot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & ESPHome
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.esphome
          key: ${{ runner.os }}-esphome-v1
          restore-keys: |
            ${{ runner.os }}-esphome-

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile ESP-Boot
        run: esphome compile esp-boot.yaml
