name: ESPHome Compile

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & ESPHome
        uses: actions/cache@v4.2.2
        with:
          path: |
            ~/.platformio
            ~/.esphome
          key: ${{ runner.os }}-esphome-${{ hashFiles('esp-boot.yaml') }}

      - name: Install ESPHome
        run: |
          pip install esphome

      - name: Compile ESP-Boot
        run: |
          esphome compile esp-boot.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: firmware-esp-boot
          path: .esphome/build/esp-boot/.pioenvs/esp-boot/firmware.factory.bin
