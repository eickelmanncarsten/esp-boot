esphome:
  name: esp-boot
  friendly_name: ESP-Boot
  # Schaltet das Backlight aktiv ein, sobald das gesamte System hochgefahren ist
  on_boot:
    priority: -100
    then:
      - output.turn_on: backlight_output
  # Hier binden wir die C++ Quelltexte direkt und absolut fehlerfrei ein
  includes:
    - my_components/custom_touch.h
    - my_components/custom_backlight.h

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Wichtig für das Waveshare-Board (8MB Octal-PSRAM)
psram:
  mode: octal

logger:
  level: DEBUG

wifi:
  ssid: "FRITZ!Box 7590 JL"
  password: "28182272528993262336"

improv_serial:

captive_portal:

i2c:
  - id: bus_a
    sda: GPIO6
    scl: GPIO7
    frequency: 400khz
    scan: true

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

pca9554:
  - id: pca9554_hub
    address: 0x20
    i2c_id: bus_a

# Das Backlight wird über das C++ Include registriert und mit dem Hub verbunden
output:
  - platform: custom
    type: binary
    lambda: |-
      auto bl = new CustomBacklightOutput();
      bl->set_pin_hub(id(pca9554_hub));
      return {bl};
    outputs:
      - id: backlight_output

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 40MHz
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    update_interval: 1s  # Zwingt das Display, sich jede Sekunde neu zu zeichnen
    lambda: |-
      it.fill(Color(255, 0, 0));

# Der Touchscreen wird als generische Custom-Komponente geladen
sensor:
  - platform: custom
    lambda: |-
      auto touch = new CustomTouch();
      return {touch};
