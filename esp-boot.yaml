esphome:
  name: esp-boot
  # Hier gehört das Einbinden von Arduino-Bibliotheken für PlatformIO hin:
  platformio_options:
    lib_deps:
      - Wire

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal

logger:
  level: DEBUG

wifi:
  ssid: "JL"
  password: "xxxxxxxxx"

improv_serial:
captive_portal:

external_components:
  - source:
      type: local
      path: .
    components: [ my_custom_i2c ]

my_custom_i2c:

# Dummy-I2C, um den IDF-Treiber von den echten Pins fernzuhalten
i2c:
  id: bus_dummy
  sda: GPIO1
  scl: GPIO2

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 40MHz
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    update_interval: 1s
    lambda: |-
      it.fill(Color(255, 0, 0));
