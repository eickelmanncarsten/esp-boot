esphome:
  name: esp-boot
  on_boot:
    priority: 850.0  # Läuft NACH dem Logger, aber zwingend VOR dem I2C-Setup (welches bei 800.0 liegt)
    then:
      - lambda: |-
          // GPIO5 (Reset für Touch/Expander) als Ausgang konfigurieren
          pinMode(5, OUTPUT);
          
          // Wir drücken den Reset-Knopf für die Peripherie hart nieder
          digitalWrite(5, LOW);
          delay(100); // 100ms gedrückt halten
          
          // Wir lassen los, damit die ICs sauber neu starten können
          digitalWrite(5, HIGH);
          delay(100); // Dem Bus Zeit geben, sich elektrisch zu fangen

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal

logger:
  level: DEBUG

wifi:
  ssid: "FRITZ!Box 7590 JL"
  password: "28182272528993262336"

improv_serial:
captive_portal:

# Hier erzwingen wir Pull-Ups und geben dem IDF-Treiber die Chance zur Recovery
i2c:
  id: bus_a
  sda: GPIO6
  scl: GPIO7
  frequency: 100kHz  # Zum Testen gehen wir erst mal auf 100kHz runter
  scan: true

pca9554:
  - id: pca9554_hub
    address: 0x20
    i2c_id: bus_a

switch:
  - platform: gpio
    name: "Backlight"
    id: backlight_switch
    pin:
      pca9554: pca9554_hub
      number: 0
      mode: OUTPUT

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 40MHz
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    update_interval: 1s
    lambda: |-
      it.fill(Color(255, 0, 0));
