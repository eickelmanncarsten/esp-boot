esphome:
  name: esp-boot
  on_boot:
    priority: 900.0  # Maximal früh, noch vor jeglicher Treiber-Zuweisung
    then:
      - lambda: |-
          // GPIO5 (Reset) sofort als Output definieren und feuern
          pinMode(5, OUTPUT);
          digitalWrite(5, LOW);
          delay(100);
          digitalWrite(5, HIGH);
          delay(150); // Dem Board etwas mehr Zeit geben, um nach dem Reset stabil zu werden

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal

logger:
  level: DEBUG

wifi:
  ssid: "FRITZ!Box 7590 JL"
  password: "28182272528993262336"

improv_serial:
captive_portal:

# Wir erzwingen SOFTWARE-I2C, um den fehlerhaften ESP-IDF Hardware-Treiber komplett zu umgehen.
# Zudem aktivieren wir die internen Pull-Ups des ESP32-S3 massiv auf den Pins.
i2c:
  - id: bus_a
    sda: GPIO6
    scl: GPIO7
    frequency: 50kHz    # Wir gehen extrem weit runter, um maximale Störsicherheit zu erzielen
    scan: true

# Wir deklarieren die Pins zusätzlich manuell als Pull-Up, um der SDA-Leitung hochzuhelfen
# falls die Hardware-Pull-Ups auf der Platine eine Macke haben.
# (Wird parallel vom Software-I2C-Framework von ESPHome so verarbeitet)

pca9554:
  - id: pca9554_hub
    address: 0x20
    i2c_id: bus_a

switch:
  - platform: gpio
    name: "Backlight"
    id: backlight_switch
    pin:
      pca9554: pca9554_hub
      number: 0
      mode: OUTPUT

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 20MHz     # Temporär halbiert zur Fehlersuche
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    update_interval: 1s
    lambda: |-
      it.fill(Color(255, 0, 0));
