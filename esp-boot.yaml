esphome:
  name: esp-boot
  on_boot:
    priority: 800.0  # Läuft ganz am Anfang, noch vor dem I2C-Setup
    then:
      - lambda: |-
          // Wir konfigurieren den Pin als Ausgang und ziehen ihn auf HIGH
          gpio_config_t io_conf = {};
          io_conf.intr_type = GPIO_INTR_DISABLE;
          io_conf.mode = GPIO_MODE_OUTPUT;
          io_conf.pin_bit_mask = (1ULL << 5); // <--- Hier die 5 durch deinen Touch-Reset-Pin ersetzen
          io_conf.pull_down_en = GPIO_PULLDOWN_DISABLE;
          io_conf.pull_up_en = GPIO_PULLUP_DISABLE;
          gpio_config(&io_conf);

          // Erst kurz LOW für den Reset, dann HIGH, um den Bus freizugeben
          gpio_set_level((gpio_num_t)5, 0); // <--- Hier auch die Pin-Nummer anpassen
          esp_rom_delay_us(10000);          // 10 Millisekunden warten
          gpio_set_level((gpio_num_t)5, 1); // <--- Und hier
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal

logger:
  level: DEBUG

wifi:
  ssid: "FRITZ!Box 7590 JL"
  password: "28182272528993262336"

improv_serial:

captive_portal:

i2c:
  - id: bus_a
    sda: GPIO6
    scl: GPIO7
    frequency: 400000Hz  # Kann unter Arduino ruhig auf 400k stehen bleiben

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

pca9554:
  - id: pca9554_hub
    address: 0x20
    i2c_id: bus_a

# Das Backlight steuern wir jetzt über einen absolut standardkonformen Template-Switch!
switch:
  - platform: template
    name: "Backlight"
    id: backlight_switch
    optimistic: true
    turn_on_action:
      lambda: |-
        my_bl.set_pin_hub(id(pca9554_hub));
        my_bl.set_state(true);
    turn_off_action:
      lambda: |-
        my_bl.set_state(false);

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 40MHz
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    update_interval: 1s
    lambda: |-
      it.fill(Color(255, 0, 0));

# Um den Touchscreen beim Booten einmalig zu initialisieren, 
# hängen wir uns einfach stressfrei in eine native Boot-Komponente
interval:
  - interval: 60s
    then:
      - lambda: |-
          static bool initialized = false;
          if (!initialized) {
            auto touch = new CustomTouch();
            touch->setup();
            initialized = true;
          }
