esphome:
  name: esp-boot
  friendly_name: ESP-Boot
  # Schaltet das Backlight aktiv ein, sobald das gesamte System (inkl. Expander) hochgefahren ist
  on_boot:
    priority: -100
    then:
      - output.turn_on: backlight_output

external_components:
  - source:
      type: local
      path: my_components

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Wichtig für das Waveshare-Board (8MB Octal-PSRAM)
psram:
  mode: octal

logger:
  level: DEBUG

wifi:
  ssid: "FRITZ!Box 7590 JL"
  password: "28182272528993262336"

improv_serial:

captive_portal:

i2c:
  - id: bus_a
    sda: GPIO6
    scl: GPIO7
    frequency: 400khz
    scan: true

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

pca9554:
  - id: pca9554_hub
    address: 0x20
    i2c_id: bus_a

output:
  - platform: custom_backlight
    id: backlight_output
    pca9554_id: pca9554_hub

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 40MHz
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    update_interval: 1s  # Zwingt das Display, sich jede Sekunde neu zu zeichnen
    lambda: |-
      it.fill(Color(255, 0, 0));

# Unsere unzerstörbare Inline-Komponente, die den Touchscreen-Fehler umgeht
custom_component:
  - lambda: |-
      class CustomTouch : public Component, public i2c::I2CDevice {
       public:
        void setup() override {
          ESP_LOGD("custom_touch", "Initialisiere FocalTech Touchscreen auf Adresse 0x%02X...", this->address_);
        }
        void loop() override {}
      };
      
      auto my_touch = new CustomTouch();
      my_touch->set_i2c_bus(id(bus_a));
      my_touch->set_i2c_address(0x38);
      return {my_touch};
