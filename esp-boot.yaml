esphome:
  name: esp-boot
  friendly_name: ESP-Boot

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: "MeinOeffentlichesWLAN"
  password: "EinSicheresPasswort123"

improv_serial:

captive_portal:

i2c:
  - id: bus_a
    sda: GPIO6
    scl: GPIO7
    frequency: 400khz
    scan: true

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

pca9554:
  - id: pca9554_hub
    address: 0x20
    i2c_id: bus_a

output:
  - platform: custom_backlight
    id: backlight_output
    pca9554_id: pca9554_hub

touchscreen:
  - platform: ft6236
    id: touch_screen
    i2c_id: bus_a
    address: 0x38

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 40MHz
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    lambda: |-
      it.fill(Color(255, 0, 0));
