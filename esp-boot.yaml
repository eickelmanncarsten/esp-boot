esphome:
  name: esp-boot

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    # Hier zwingen wir PlatformIO, die Wire-Bibliothek einzubinden:
  libraries:
    - Wire

psram:
  mode: octal

logger:
  level: DEBUG

wifi:
  ssid: "FRITZ!Box 7590 JL"
  password: "28182272528993262336"

improv_serial:
captive_portal:

# Wir binden unseren lokalen Ordner als externe Komponente ein
external_components:
  - source:
      type: local
      path: .
    components: [ my_custom_i2c ]

# Aktiviert unsere Custom-I2C-Komponente beim Booten
my_custom_i2c:

# Wir legen den offiziellen I2C-Bus auf ungenutzte Dummy-Pins,
# damit der IDF-Treiber die echten Leitungen (6 und 7) nicht blockiert!
i2c:
  id: bus_dummy
  sda: GPIO1
  scl: GPIO2

spi:
  - id: spi_bus
    clk_pin: GPIO47
    mosi_pin: GPIO41

display:
  - platform: ili9xxx
    id: display_lcd
    spi_id: spi_bus
    model: ST7796
    dimensions:
      width: 320
      height: 480
    data_rate: 40MHz
    invert_colors: false
    cs_pin: GPIO42
    dc_pin: GPIO45
    reset_pin: GPIO40
    rotation: 0°
    update_interval: 1s
    lambda: |-
      it.fill(Color(255, 0, 0));
